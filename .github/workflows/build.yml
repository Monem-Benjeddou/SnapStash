# Builds the universal Mac app on every push and pull request.
# Pushing a tag like v1.1 also publishes a GitHub Release with the build attached.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # v1.1 -> 1.1 for tagged builds; otherwise 0.0-dev
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0-dev' }}

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Load signing certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then
            echo "::warning::No MAC_CERT_P12 secret: the app is signed ad hoc."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | awk -F'"' 'NF>1 {print $2; exit}')"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build universal app
        run: |
          ./build.sh "${VERSION#v}"
          lipo -archs build/SnapStash.app/Contents/MacOS/SnapStash | grep -q x86_64
          lipo -archs build/SnapStash.app/Contents/MacOS/SnapStash | grep -q arm64
          codesign --verify --deep --strict build/SnapStash.app
          codesign -dvv build/SnapStash.app 2>&1 | grep -E "Format|Authority|Identifier" || true
          ditto -c -k --keepParent build/SnapStash.app SnapStash-mac.zip
          shasum -a 256 SnapStash-mac.zip | tee SnapStash-mac.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: |
            SnapStash-mac.zip
            SnapStash-mac.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<NOTES
          **Mac** (macOS 14 or later, Apple Silicon or Intel). The quickest way to install or update is to paste this into Terminal:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/Monem-Benjeddou/SnapStash/main/install.sh | bash
          \`\`\`

          Or download \`SnapStash-mac.zip\`, unzip it, and move SnapStash.app to Applications. The app isn't notarized by Apple, so on macOS 15 or later click **Open Anyway** in System Settings › Privacy & Security after the first launch (on macOS 14, right-click → Open).

          SnapStash lives in the menu bar. Press ⌥⇧4 to capture an area (⌥⇧5 window, ⌥⇧3 screen, ⌥⇧2 copy text). The first capture asks for Screen Recording permission.

          The [README](https://github.com/${{ github.repository }}#readme) has the full guide. SHA-256 checksum: \`SnapStash-mac.zip.sha256\`.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$TAG" SnapStash-mac.zip SnapStash-mac.zip.sha256 \
            --repo "${{ github.repository }}" --title "SnapStash ${TAG#v}" --notes-file notes.md --generate-notes
